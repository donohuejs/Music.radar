name: Discover local event sources

on:
  schedule:
    - cron: "15 10 * * *"
  workflow_dispatch:
    inputs:
      latitude:
        description: "Optional latitude to queue before processing"
        required: false
        type: string
      longitude:
        description: "Optional longitude to queue before processing"
        required: false
        type: string
      radiusMiles:
        description: "Discovery radius for the optional location"
        required: false
        default: "25"
        type: string
      force:
        description: "Refresh coverage even when cells are still fresh"
        required: false
        default: false
        type: boolean
      sourceName:
        description: "Optional verified source name to register"
        required: false
        type: string
      sourceUrl:
        description: "Optional verified source URL to register"
        required: false
        type: string
      sourceParser:
        description: "Reusable parser for the optional source"
        required: false
        default: "json-ld-listing"
        type: string
      sourceCategory:
        description: "Default category for the optional verified source"
        required: false
        default: "music"
        type: string

permissions:
  contents: read

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Register requested verified source
        if: ${{ inputs.sourceName != '' && inputs.sourceUrl != '' && inputs.latitude != '' && inputs.longitude != '' }}
        env:
          MUSIC_RADAR_INGEST_SECRET: ${{ secrets.MUSIC_RADAR_INGEST_SECRET }}
          SOURCE_NAME: ${{ inputs.sourceName }}
          SOURCE_URL: ${{ inputs.sourceUrl }}
          SOURCE_PARSER: ${{ inputs.sourceParser }}
          SOURCE_CATEGORY: ${{ inputs.sourceCategory }}
          SOURCE_LATITUDE: ${{ inputs.latitude }}
          SOURCE_LONGITUDE: ${{ inputs.longitude }}
        run: |
          payload="$(jq -n \
            --arg name "$SOURCE_NAME" \
            --arg url "$SOURCE_URL" \
            --arg parser "$SOURCE_PARSER" \
            --arg category "$SOURCE_CATEGORY" \
            --argjson latitude "$SOURCE_LATITUDE" \
            --argjson longitude "$SOURCE_LONGITUDE" \
            '{name:$name, url:$url, parser:$parser, category:$category, latitude:$latitude, longitude:$longitude, enabled:true}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $MUSIC_RADAR_INGEST_SECRET" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://music-radar-one.vercel.app/api/sources
      - name: Queue requested discovery location
        if: ${{ inputs.latitude != '' && inputs.longitude != '' }}
        env:
          MUSIC_RADAR_INGEST_SECRET: ${{ secrets.MUSIC_RADAR_INGEST_SECRET }}
          DISCOVERY_LATITUDE: ${{ inputs.latitude }}
          DISCOVERY_LONGITUDE: ${{ inputs.longitude }}
          DISCOVERY_RADIUS: ${{ inputs.radiusMiles }}
          DISCOVERY_FORCE: ${{ inputs.force }}
        run: |
          test -n "$MUSIC_RADAR_INGEST_SECRET"
          payload="$(jq -n \
            --argjson latitude "$DISCOVERY_LATITUDE" \
            --argjson longitude "$DISCOVERY_LONGITUDE" \
            --argjson radiusMiles "$DISCOVERY_RADIUS" \
            --argjson force "$DISCOVERY_FORCE" \
            '{action:"queue", latitude:$latitude, longitude:$longitude, radiusMiles:$radiusMiles, force:$force}')"
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $MUSIC_RADAR_INGEST_SECRET" \
            --header "Content-Type: application/json" \
            --data "$payload" \
            https://music-radar-one.vercel.app/api/discover
      - name: Process queued discovery locations
        env:
          MUSIC_RADAR_INGEST_SECRET: ${{ secrets.MUSIC_RADAR_INGEST_SECRET }}
        run: |
          test -n "$MUSIC_RADAR_INGEST_SECRET"
          for attempt in {1..8}; do
            response="$(curl --fail-with-body --silent --show-error \
              --max-time 58 \
              --request POST \
              --header "Authorization: Bearer $MUSIC_RADAR_INGEST_SECRET" \
              --header "Content-Type: application/json" \
              --data '{"action":"run","limit":1}' \
              https://music-radar-one.vercel.app/api/discover)"
            echo "$response"
            jq -e '(.results // []) | all(.ok == true)' <<< "$response" >/dev/null
          done
      - name: Ingest registered sources
        env:
          MUSIC_RADAR_INGEST_SECRET: ${{ secrets.MUSIC_RADAR_INGEST_SECRET }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $MUSIC_RADAR_INGEST_SECRET" \
            https://music-radar-one.vercel.app/api/ingest-sources

  poster-extraction:
    needs: discover
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install open-source document tools
        run: sudo apt-get update && sudo apt-get install -y poppler-utils tesseract-ocr
      - name: Extract text from newly discovered posters
        env:
          MUSIC_RADAR_INGEST_SECRET: ${{ secrets.MUSIC_RADAR_INGEST_SECRET }}
          MUSIC_RADAR_API_BASE: https://music-radar-one.vercel.app
        run: node scripts/poster-worker.js
